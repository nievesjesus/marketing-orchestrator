name: Release

# Push a tag like v0.1.0 to publish: the npm package @codeame/marketing-images, the multi-arch Docker image
# ghcr.io/nievesjesus/marketing-images and a GitHub Release with the skill and plugin zips.
#
# One-time setup (see servers/marketing-images/README.md, "Releasing"):
#   - create the npm organization "codeame" and add an npm token with publish rights as the repository secret NPM_TOKEN
#   - the Docker push uses the built-in GITHUB_TOKEN; make the GHCR package public after the first push

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/marketing-images
    steps:
      - uses: actions/checkout@v4

      - name: The tag must equal the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          src="$(sed -n "s/^export const VERSION = '\(.*\)';.*/\1/p" src/version.ts)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match servers/marketing-images/package.json version ${pkg}"
            exit 1
          fi
          if [ "$src" != "$pkg" ]; then
            echo "::error::src/version.ts VERSION (${src}) does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servers/marketing-images/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - name: Tests (offline)
        run: npm test
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: servers/marketing-images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: servers/marketing-images/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Publish the Docker image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nievesjesus/marketing-images
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: servers/marketing-images
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release with the skill and plugin zips
    needs: [npm, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the zips (validates the skill first)
        run: bash build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/marketing-orchestrator.zip
            dist/marketing-orchestrator-plugin.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
