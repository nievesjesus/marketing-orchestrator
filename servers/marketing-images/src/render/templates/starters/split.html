<!-- Starter equivalent of the built-in "split": photo on top, brand-color panel with the text below (the built-in puts them side by side on landscape). -->
<div style="display:flex;flex-direction:column;position:relative;width:{{format.width}}px;height:{{format.height}}px;background:{{brand.color.primary}};font-family:{{brand.font.body}}">
  <div style="display:flex;position:relative;flex:0.8">
    <img src="{{asset.background}}" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover" />
    <img src="{{brand.logo}}" style="position:absolute;left:{{px.40}}px;top:{{px.40}}px;width:{{px.170}}px;height:{{px.70}}px;object-fit:contain;object-position:left top" />
  </div>
  <div style="display:flex;flex-direction:column;justify-content:center;flex:1;padding:{{px.36}}px {{safe.right}}px {{safe.bottom}}px {{safe.left}}px;color:{{brand.color.paper}}">
    <div style="display:flex;font-family:{{brand.font.accent}};font-weight:700;font-size:{{px.28}}px;letter-spacing:{{px.4}}px;text-transform:{{brand.style.eyebrow_transform}};color:{{brand.color.accent}}">{{var.eyebrow}}</div>
    <div data-fit data-fit-max="{{px.110}}" data-fit-min="{{px.44}}" data-fit-lines="3" style="display:flex;margin-top:{{px.18}}px;font-family:{{brand.font.heading}};font-weight:700;line-height:1.05">{{var.headline}}</div>
    <div data-fit data-fit-max="{{px.40}}" data-fit-min="{{px.24}}" data-fit-lines="2" style="display:flex;margin-top:{{px.22}}px;line-height:1.35">{{var.body}}</div>
    <div style="display:flex;margin-top:{{px.30}}px">
      <div style="display:flex;padding:{{px.16}}px {{px.44}}px;border-radius:9999px;background:{{brand.color.accent}};color:{{brand.color.ink}};font-family:{{brand.font.accent}};font-weight:700;font-size:{{px.34}}px">{{var.cta}}</div>
    </div>
  </div>
</div>
