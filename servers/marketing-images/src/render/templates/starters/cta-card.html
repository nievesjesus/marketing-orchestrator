<!-- Starter equivalent of the built-in "cta-card": brand-color card, centered headline, pill button, logo top-left. -->
<div style="display:flex;position:relative;width:{{format.width}}px;height:{{format.height}}px;background:{{brand.color.primary}};font-family:{{brand.font.body}}">
  <img src="{{brand.logo}}" style="position:absolute;left:{{safe.left}}px;top:{{safe.top}}px;width:{{px.170}}px;height:{{px.70}}px;object-fit:contain;object-position:left top" />
  <div style="position:absolute;left:{{safe.left}}px;right:{{safe.right}}px;top:{{safe.top}}px;bottom:{{safe.bottom}}px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:{{brand.color.paper}}">
    <div style="display:flex;font-family:{{brand.font.accent}};font-weight:700;font-size:{{px.30}}px;letter-spacing:{{px.4}}px;text-transform:{{brand.style.eyebrow_transform}};color:{{brand.color.accent}}">{{var.eyebrow}}</div>
    <div data-fit data-fit-max="{{px.140}}" data-fit-min="{{px.48}}" data-fit-lines="4" style="display:flex;justify-content:center;width:100%;margin-top:{{px.24}}px;font-family:{{brand.font.heading}};font-weight:700;line-height:1.05">{{var.headline}}</div>
    <div data-fit data-fit-max="{{px.46}}" data-fit-min="{{px.26}}" data-fit-lines="3" style="display:flex;justify-content:center;width:100%;margin-top:{{px.30}}px;line-height:1.35">{{var.body}}</div>
    <div style="display:flex;margin-top:{{px.52}}px;padding:{{px.22}}px {{px.56}}px;border-radius:9999px;background:{{brand.color.accent}};color:{{brand.color.ink}};font-family:{{brand.font.accent}};font-weight:700;font-size:{{px.44}}px">{{var.cta}}</div>
    <div style="display:flex;margin-top:{{px.40}}px;font-size:{{px.28}}px;opacity:0.85">{{var.footer}}</div>
  </div>
</div>
