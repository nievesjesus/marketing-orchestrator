<!-- Starter equivalent of the built-in "photo-headline": photo, soft gradient, eyebrow + headline + body at the bottom, logo top-left. Remove what you do not need. -->
<div style="display:flex;position:relative;width:{{format.width}}px;height:{{format.height}}px;background:{{brand.color.primary}};font-family:{{brand.font.body}}">
  <img src="{{asset.background}}" style="position:absolute;left:0;top:0;width:{{format.width}}px;height:{{format.height}}px;object-fit:cover" />
  <div style="position:absolute;left:0;top:0;width:{{format.width}}px;height:{{format.height}}px;background-image:linear-gradient(to bottom, rgba(11,16,32,0) 12%, rgba(11,16,32,0.55) 36%, rgba(11,16,32,0.78) 56%, rgba(11,16,32,0.92) 100%)"></div>
  <img src="{{brand.logo}}" style="position:absolute;left:{{safe.left}}px;top:{{safe.top}}px;width:{{px.170}}px;height:{{px.70}}px;object-fit:contain;object-position:left top" />
  <div style="position:absolute;left:{{safe.left}}px;right:{{safe.right}}px;bottom:{{safe.bottom}}px;display:flex;flex-direction:column;color:{{brand.color.paper}}">
    <div style="display:flex;font-family:{{brand.font.accent}};font-weight:700;font-size:{{px.30}}px;letter-spacing:{{px.4}}px;text-transform:{{brand.style.eyebrow_transform}};color:{{brand.color.accent}}">{{var.eyebrow}}</div>
    <div data-fit data-fit-max="{{px.135}}" data-fit-min="{{px.48}}" data-fit-lines="4" style="display:flex;margin-top:{{px.22}}px;font-family:{{brand.font.heading}};font-weight:700;line-height:1.05">{{var.headline}}</div>
    <div data-fit data-fit-max="{{px.44}}" data-fit-min="{{px.26}}" data-fit-lines="3" style="display:flex;margin-top:{{px.28}}px;line-height:1.35">{{var.body}}</div>
    <div style="display:flex;margin-top:{{px.36}}px;font-size:{{px.28}}px;opacity:0.85">{{var.footer}}</div>
  </div>
</div>
